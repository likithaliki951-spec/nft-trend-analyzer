[project]
name = "nft-trend-analyzer"
version = "2.4.0"
description = "Analysis of Trending NFTs Using Time-Series Data and Machine Learning"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "pytest>=7.0",
    "requests>=2.28",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
